<div class="page-container">
  <div class="page-header">
    <div class="page-title-group">
      <h1>Account Security</h1>
      <p class="page-subtitle">Update your portal login password</p>
    </div>
  </div>

  <div class="card" style="max-width: 520px;">
    <div class="card-header">
      <div class="card-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        Change Password
      </div>
    </div>

    <form [formGroup]="pwForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label class="form-label">Current Password *</label>
        <input type="password" formControlName="currentPassword" class="form-control" placeholder="Enter current password" />
      </div>

      <div class="form-group">
        <label class="form-label">New Password *</label>
        <input type="password" formControlName="newPassword" class="form-control" placeholder="Min 6 characters" />
      </div>

      <div class="form-group">
        <label class="form-label">Confirm New Password *</label>
        <input type="password" formControlName="confirmPassword" class="form-control" placeholder="Re-enter new password" />
      </div>

      <div style="margin-top: 24px; display: flex; gap: 12px;">
        <button type="submit" class="btn btn-primary" [disabled]="isLoading">
          @if (isLoading) {
            <span class="spinner"></span> Updating...
          } @else {
            Update Password
          }
        </button>
      </div>
    </form>
  </div>
</div>
